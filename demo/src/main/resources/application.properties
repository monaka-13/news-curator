spring.application.name=demo

# Groq (OpenAI-compatible). Override via .env in demo/ — see .env.example
app.summarization.enabled=false
app.summarization.api-key=
app.summarization.base-url=https://api.groq.com/openai/v1
app.summarization.model=llama-3.1-8b-instant
app.summarization.max-body-chars=16000
app.summarization.connect-timeout-ms=10000
app.summarization.read-timeout-ms=120000
